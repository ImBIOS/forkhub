name: Release

# Single publishing pipeline — npm Trusted Publisher allows registering exactly
# ONE workflow file per package, so both channels live here:
#
#   - push to `canary` branch → forkhub@<base>-canary.<YYYYMMDDHHmm>.<sha7> on dist-tag `canary`
#                               + rolling GitHub Release `canary` (binaries + SHA256SUMS, prerelease)
#   - push tag `vX.Y.Z`       → forkhub@X.Y.Z on dist-tag `latest` + GitHub Release
#                               (binaries + SHA256SUMS + Homebrew formula)
#
# Register this file (`publish.yml`) as the package's Trusted Publisher at npmjs.com.

on:
  push:
    branches:
      - canary
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/canary' }}

jobs:
  # Stable releases may ONLY be tagged from the canary branch history.
  guard-tag-on-canary:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag commit is reachable from origin/canary
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          TAG_COMMIT=$(git rev-parse "refs/tags/${{ github.ref_name }}^{commit}")
          git fetch origin canary
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/canary; then
            echo "::error::Tag ${{ github.ref_name }} ($TAG_COMMIT) is NOT on canary. Stable tags must be cut from canary."
            exit 1
          fi

  canary-summary:
    if: github.ref == 'refs/heads/canary'
    needs: [publish-canary-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Install instructions
        run: |
          echo "### Canary published 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo 'pnpm add -g "github:ImBIOS/forkhub#canary&path:packages/cli"' >> "$GITHUB_STEP_SUMMARY"
          echo '# or, once the canary dist-tag propagates:' >> "$GITHUB_STEP_SUMMARY"
          echo 'npm i -g forkhub@canary' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub rolling release: https://github.com/ImBIOS/forkhub/releases/tag/canary' >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────── canary channel: npm ────────────────────────

  canary-typecheck:
    if: github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck CLI
        run: pnpm exec tsc --noEmit
        working-directory: packages/cli

  publish-canary-npm:
    if: github.ref == 'refs/heads/canary'
    needs: [canary-typecheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute canary version
        id: ver
        run: |
          BASE=$(node -p "require('./packages/cli/package.json').version")
          TS=$(date -u +%Y%m%d%H%M)
          SHA=$(git rev-parse --short=7 HEAD)
          echo "version=${BASE}-canary.${TS}.${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set canary version in package.json
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('./package.json','utf8'));j.version=process.env.VERSION;fs.writeFileSync('./package.json',JSON.stringify(j,null,2)+'\n')"

      - name: Publish to npm (dist-tag canary, trusted-publisher OIDC)
        working-directory: packages/cli
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --access public --provenance=true --tag canary

  canary-binaries:
    if: github.ref == 'refs/heads/canary'
    needs: [canary-typecheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-24.04
            artifact: forkhub-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-24.04-arm
            artifact: forkhub-linux-arm64
          - target: bun-darwin-x64
            os: macos-15-intel
            artifact: forkhub-darwin-x64
          - target: bun-darwin-arm64
            os: macos-14
            artifact: forkhub-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build binary
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} --minify \
            --outfile=dist/${{ matrix.artifact }} ./src/cli.ts
        working-directory: packages/cli
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: canary-${{ matrix.artifact }}
          path: packages/cli/dist/*
          if-no-files-found: error

  # Independent of publish-canary-npm so the GitHub channel keeps shipping even
  # if npm is unavailable (e.g. before first-ever manual package claim).
  canary-release:
    if: github.ref == 'refs/heads/canary'
    needs: [canary-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Move `canary` tag and upsert rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./packages/cli/package.json').version")
          VERSION="${BASE}-canary.$(date -u +%Y%m%d%H%M).$(git rev-parse --short=7 HEAD)"
          (cd dist && sha256sum forkhub-* > SHA256SUMS)
          {
            echo "Rolling canary build of \`canary\` @ \`${GITHUB_SHA}\`"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- npm: \`forkhub@${VERSION}\` on dist-tag \`canary\`"
            echo
            echo '```bash'
            echo '# CLI via git ref'
            echo 'pnpm add -g "github:ImBIOS/forkhub#canary&path:packages/cli"'
            echo
            echo '# or standalone binary (pick your platform asset)'
            echo 'curl -fsSL -o fh https://github.com/ImBIOS/forkhub/releases/download/canary/forkhub-linux-x64 && chmod +x fh'
            echo '```'
            echo
            echo '> Pre-release channel — expect breakage. Stable: [latest release](https://github.com/ImBIOS/forkhub/releases/latest).'
          } > notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f canary "$GITHUB_SHA"
          git push -f origin refs/tags/canary

          if gh release view canary --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit canary --title "canary" --notes-file notes.md --prerelease --latest=false
            gh release upload canary dist/* --clobber
          else
            gh release create canary dist/* --title "canary" --notes-file notes.md --prerelease --latest=false
          fi

  # ────────────────────────── stable channel ──────────────────────────

  publish-stable-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [guard-tag-on-canary]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit
        working-directory: packages/cli

      - name: Publish to npm (trusted publisher, OIDC)
        run: npm publish --access public --provenance=true
        working-directory: packages/cli
        env:
          NPM_CONFIG_PROVENANCE: true

  build-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-stable-npm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-24.04
            artifact: forkhub-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-24.04-arm
            artifact: forkhub-linux-arm64
          - target: bun-darwin-x64
            os: macos-15-intel
            artifact: forkhub-darwin-x64
          - target: bun-darwin-arm64
            os: macos-14
            artifact: forkhub-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build binary
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} --minify \
            --outfile=dist/${{ matrix.artifact }} ./src/cli.ts
        working-directory: packages/cli
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/*
          if-no-files-found: error

  attach-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Compute SHA256SUMS
        run: (cd dist && sha256sum forkhub-* > SHA256SUMS)
      - name: Attach binaries to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/forkhub-linux-x64
            dist/forkhub-linux-arm64
            dist/forkhub-darwin-x64
            dist/forkhub-darwin-arm64
            dist/SHA256SUMS

  update-homebrew-formula:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attach-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: canary
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Compute SHA256 for all platforms
        id: sha
        run: |
          echo "darwin_arm64=$(sha256sum dist/forkhub-darwin-arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "darwin_x64=$(sha256sum dist/forkhub-darwin-x64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$(sha256sum dist/forkhub-linux-x64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum dist/forkhub-linux-arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Update Formula/forkhub.rb in this repo
        env:
          VERSION: ${{ github.ref_name }}
          DARWIN_ARM64: ${{ steps.sha.outputs.darwin_arm64 }}
          DARWIN_X64: ${{ steps.sha.outputs.darwin_x64 }}
          LINUX_X64: ${{ steps.sha.outputs.linux_x64 }}
          LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
        run: |
          mkdir -p Formula
          cat > Formula/forkhub.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          class Forkhub < Formula
            desc "Keep up-to-date upstream + your custom patches. Patches are intent, not diffs."
            homepage "https://github.com/ImBIOS/forkhub"
            version "${VERSION#v}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/ImBIOS/forkhub/releases/download/${VERSION}/forkhub-darwin-x64"
                sha256 "${DARWIN_X64}"
              end
              on_arm do
                url "https://github.com/ImBIOS/forkhub/releases/download/${VERSION}/forkhub-darwin-arm64"
                sha256 "${DARWIN_ARM64}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/ImBIOS/forkhub/releases/download/${VERSION}/forkhub-linux-x64"
                sha256 "${LINUX_X64}"
              end
              on_arm do
                url "https://github.com/ImBIOS/forkhub/releases/download/${VERSION}/forkhub-linux-arm64"
                sha256 "${LINUX_ARM64}"
              end
            end

            def install
              os_arch = if OS.mac? && Hardware::CPU.arm?
                "darwin-arm64"
              elsif OS.mac?
                "darwin-x64"
              elsif Hardware::CPU.arm?
                "linux-arm64"
              else
                "linux-x64"
              end
              bin.install "forkhub-#{os_arch}" => "fh"
            end

            test do
              assert_match "forkhub", shell_output("#{bin}/fh --help")
            end
          end
          EOF
      - name: Commit formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout canary
          git add Formula/forkhub.rb
          git commit -m "chore: update homebrew formula to ${VERSION} [skip ci]" || echo "No changes to commit"
          git push origin canary
