name: Publish Canary

on:
  push:
    branches: [canary]
  workflow_dispatch:

# NOTE: npm OIDC trusted publishing requires this exact repo + workflow to be
# registered as a trusted publisher on the `forkhub` package at npmjs.com
# (same as publish.yml). First-ever publish must be done manually to claim the name.

jobs:
  publish-canary-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit
        working-directory: packages/cli

      - name: Compute canary version
        id: ver
        run: |
          BASE=$(node -p "require('./packages/cli/package.json').version")
          TS=$(date -u +%Y%m%d%H%M)
          SHA=$(git rev-parse --short=7 HEAD)
          echo "version=${BASE}-canary.${TS}.${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set canary version in package.json
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "const fs=require('fs');const f='./package.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "Publishing $(node -p "require('./package.json').version")"

      - name: Publish to npm (dist-tag canary, trusted-publisher OIDC)
        working-directory: packages/cli
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --access public --provenance=true --tag canary

  build-canary-binaries:
    needs: [publish-canary-npm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-24.04
            artifact: forkhub-linux-x64
          - target: bun-darwin-arm64
            os: macos-14
            artifact: forkhub-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build binary
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} --minify \
            --outfile=dist/${{ matrix.artifact }} ./src/cli.ts
        working-directory: packages/cli
      - name: Upload artifact (nightly tag)
        uses: actions/upload-artifact@v7
        with:
          name: canary-${{ matrix.artifact }}
          path: packages/cli/dist/*
          if-no-files-found: error

  summary:
    needs: [publish-canary-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Install instructions
        run: |
          echo "### Canary published 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo 'pnpm add -g "github:ImBIOS/forkhub#canary&path:packages/cli"' >> "$GITHUB_STEP_SUMMARY"
          echo '# or, once the canary dist-tag propagates:' >> "$GITHUB_STEP_SUMMARY"
          echo 'npm i -g forkhub@canary' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
